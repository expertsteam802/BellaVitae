name: Extract clinic source archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract source files into repository root
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("bellavitaemedicalclinic-main.zip")
          if not archive.exists():
              raise SystemExit("Source ZIP not found in repository root")

          temp = Path("_clinic_extract_tmp")
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()

          with ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  parts = [p for p in name.split("/") if p not in ("", ".")]
                  if not parts or any(p == ".." for p in parts):
                      continue
                  # Skip secrets, Git metadata, and installed dependencies.
                  if any(p.lower() == ".env" or p.lower().startswith(".env.") for p in parts):
                      continue
                  if any(p in (".git", "node_modules") for p in parts):
                      continue
                  target = temp.joinpath(*parts[1:]) if len(parts) > 1 else temp / parts[0]
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          # The ZIP has one top-level project directory; move its contents to root.
          for item in temp.iterdir():
              if item.name == "README.md" and Path("README.md").exists():
                  continue
              destination = Path(item.name)
              if destination.exists():
                  if destination.is_dir():
                      shutil.rmtree(destination)
                  else:
                      destination.unlink()
              shutil.move(str(item), str(destination))

          shutil.rmtree(temp)
          archive.unlink()
          PY

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit"
            exit 0
          fi
          git commit -m "Extract Bella Vitae clinic source into repository"
          git push origin main
